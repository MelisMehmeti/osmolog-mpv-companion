<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>Osmolog Companion</title><link rel="stylesheet" href="styles.css"></head>
<body><main id="appShell" class="app-shell" data-mode="expanded">
<section id="expandedWindow" class="expanded-window" aria-label="Osmolog Companion">
<header class="titlebar"><span class="brand"><img src="../../assets/osmolog-icon-small.svg" alt=""><b>OSMOLOG COMPANION</b></span><div class="window-actions"><button id="settingsButton" aria-label="Open settings" title="Settings">⚙</button><button id="minimizeButton" aria-label="Minimize to compact overlay">−</button><button id="closeButton" aria-label="Close to system tray">×</button></div></header>
<div id="connectionBanner" class="disconnected" hidden><span id="connectionMessage">Connect to Osmolog to sync your time</span><button id="pairButton" class="secondary">Open Osmolog</button></div>
<div class="window-body"><nav id="connections" class="connections" aria-label="Player connections"></nav><div id="pageContent"></div></div>
<div id="feedback" class="notice" role="status" hidden></div>
<aside id="updateBanner" class="update-banner" hidden><div class="update-copy"><strong id="updateHeading"></strong><p id="updateStatus" role="status"></p><progress id="updateProgress" max="100" hidden></progress></div><button id="restartUpdateButton" class="primary" hidden>Restart to update</button></aside>
<footer class="app-version-footer"><span id="appVersion">Companion</span></footer>
</section><button id="compactOverlay" class="compact-overlay" aria-label="Move companion; click to expand" hidden><i id="compactDot"></i><strong id="compactTime">0s</strong><span id="compactLanguage">JAPANESE</span></button>
</main><script src="view-model.js"></script><script src="ui-components.js"></script><script src="renderer.js"></script></body></html>
