name: Release Windows companion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content -Raw package.json | ConvertFrom-Json).version)"
          if ("${{ github.ref_name }}" -ne $expected) { throw "Tag ${{ github.ref_name }} does not match $expected" }
      - run: npm run pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem dist -File -Filter '*.exe' | ForEach-Object { "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
